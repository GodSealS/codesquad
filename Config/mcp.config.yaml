# CodeSquad MCP Server Configuration
# ====================================
# This file is auto-generated by `codesquad mcp serve`.
# Edit manually to customize server settings.
#
# This config is loaded by:
#   - src/mcp/config.ts  (primary, via loadMcpConfig)
#   - src/repl/index.ts  (fallback, via loadAndRegisterMCPTools)

version: 1

server:
  transport: stdio          # stdio | http
  http_port: 9090           # HTTP port (when transport=http)
  auth_token: "${MCP_AUTH_TOKEN}"
  bind: "127.0.0.1"
  cors_origins:
    - "http://localhost:5173"

provider:
  default: deepseek
  routing:
    anthropic: claude-sonnet-4-20250514
    openai: gpt-4o
    deepseek: deepseek-chat
    kimi: kimi-k2.6
  fallback_chain:
    - anthropic
    - deepseek
  call_timeout_ms: 60000
  circuit_breaker:
    failure_threshold: 5
    window_seconds: 60

workspace:
  default_root: "${cwd}"
  enforce_boundary: true
  read_only_extras: []
  auto_init: false

budget:
  per_call_max_tokens: 8192
  per_call_cost_usd: 0.5
  per_session_cost_usd: 5.0

tools:
  enabled:
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - WebSearch
    - WebFetch
  bash:
    enabled: false
    whitelist:
      - "git status"
      - "git diff"
      - "git log"
      - "npm test"

observability:
  log_level: info
  log_format: text
  metrics_enabled: true
  trace_enabled: true
  otel_endpoint: ""
  audit_log_path: ".codesquad/agent-memory/audit.log"

context:
  soft_limit_tokens: 100000
