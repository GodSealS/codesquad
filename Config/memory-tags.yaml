# Memory Tag Classification
# ========================
# Domain tags for classifying and matching memories.
# Each tag has a display name and keyword list for context matching.
#
# Loaded by: src/memory/memory-tags.ts
# Format: tag_key: { name: "显示名", keywords: [关键词列表] }
# Keywords support both Chinese and English terms.
#
# To add a new domain:
#   1. Add a new entry under `tags:` with a unique key
#   2. Set the display `name` and `keywords`
#   3. When storing memories, use the key or name in the `tags` frontmatter field

