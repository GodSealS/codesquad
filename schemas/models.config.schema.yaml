$schema: "http://json-schema.org/draft-07/schema#"
title: CodeSquad Model Configuration
description: Schema for models.config.yaml
type: object
additionalProperties: false
properties:
  version:
    type: integer
    minimum: 1
    default: 1
    description: Configuration format version
  agents:
    type: object
    default: {}
    description: Per-agent model overrides (string or {model, source})
    additionalProperties: true
  skills:
    type: object
    default: {}
    description: Per-skill model overrides (string or {model, source})
    additionalProperties: true
  batch:
    type: object
    default: {}
    description: Batch pattern-to-model mappings (key = glob pattern, value = model ID)
    additionalProperties:
      type: string
  default:
    type: string
    nullable: true
    default: null
    description: Fallback default model (null = use agent/skill original)
  api:
    type: object
    default: { sources: {} }
    description: External API endpoint sources
    additionalProperties: false
    properties:
      sources:
        type: object
        default: {}
        description: Named API sources
        additionalProperties:
          type: object
          additionalProperties: false
          properties:
            provider:
              type: string
              enum: [openai-compatible, anthropic, custom]
            baseUrl:
              type: string
              format: uri
            apiKey:
              type: string
              description: API key (supports ${ENV_VAR} syntax)
            headers:
              type: object
              additionalProperties:
                type: string
required: [version]
